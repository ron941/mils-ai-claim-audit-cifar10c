project:
  name: CIFAR-10-C Robustness Audit
  seed: 42

paths:
  data_dir: data
  cifar10_dir: data/cifar10
  cifar10c_dir: data/cifar10-c
  output_dir: outputs
  predictions_dir: outputs/predictions
  figures_dir: outputs/figures
  failure_cases_dir: outputs/failure_cases

data:
  cifar10c_url: https://huggingface.co/datasets/torch-uncertainty/CIFAR-C/resolve/main/CIFAR-10-C.tar
  corruptions:
    - gaussian_noise
    - motion_blur
    - fog
    - contrast
    - jpeg_compression
  severities: [1, 3, 5]
  max_samples: null

runtime:
  device: cuda:0
  batch_size: 512
  num_workers: 4

models:
  prefer_robustbench: true
  robustbench:
    standard: Standard
    robust: Hendrycks2020AugMix_WRN
  fallback:
    standard: cifar10_resnet56
    alternate: cifar10_vgg16_bn

tta:
  enabled: true
  horizontal_flip: true

failure_cases:
  per_model: 5
  high_confidence_threshold: 0.8
